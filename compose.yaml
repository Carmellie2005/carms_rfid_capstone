services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "80"
    environment:
      APP_NAME: "${APP_NAME:-SLSU Bontoc Patrol}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?Set APP_KEY in Dokploy}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://slsubcpatrol.site}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Manila}"
      APP_PORT: "${APP_PORT:-80}"

      LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
      LOG_DEPRECATIONS_CHANNEL: "${LOG_DEPRECATIONS_CHANNEL:-null}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-database}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-campus_rfid_patrol}"
      DB_USERNAME: "${DB_USERNAME:-campus_user}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}"

      BROADCAST_DRIVER: "${BROADCAST_DRIVER:-log}"
      CACHE_DRIVER: "${CACHE_DRIVER:-file}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-public}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-slsubcpatrol.site}"

      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@slsubcpatrol.site}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-SLSU Bontoc Patrol}"
    volumes:
      - app_public_uploads:/var/www/html/storage/app/public
      - app_framework_storage:/var/www/html/storage/framework
      - app_logs:/var/www/html/storage/logs

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-campus_rfid_patrol}"
      MYSQL_USER: "${DB_USERNAME:-campus_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in Dokploy}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  app_public_uploads:
  app_framework_storage:
  app_logs:
  mysql_data:
