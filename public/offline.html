<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d4ed8">
    <title>Offline | SLSU Bontoc Patrol</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: #eff6ff;
            color: #0f172a;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            background: #ffffff;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            max-width: 420px;
            padding: 28px;
            text-align: center;
        }

        img {
            height: 72px;
            margin-bottom: 16px;
            width: 72px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 10px;
        }

        p {
            color: #475569;
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>
    <main>
        <img src="/pwa-icon-192.png" alt="SLSU RFID Patrol System logo">
        <h1>You are offline</h1>
        <p>SLSU Bontoc Patrol needs a network connection for login, RFID checks, reports, and PDF generation. Please reconnect and try again.</p>
    </main>
</body>
</html>
