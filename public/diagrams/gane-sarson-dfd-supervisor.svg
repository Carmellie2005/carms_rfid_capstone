<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Supervisor/Admin Data Flow Diagram - SLSU BC Patrol</title>
  <desc id="desc">Clean Gane and Sarson style data flow diagram for supervisor-side processes in SLSU BC Patrol.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .title { font: 700 30px Arial, Helvetica, sans-serif; fill: #0f2a63; }
    .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #526173; }
    .column { font: 700 13px Arial, Helvetica, sans-serif; fill: #64748b; letter-spacing: .04em; }
    .entity-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f2a63; }
    .entity-text { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
    .process-num { font: 700 15px Arial, Helvetica, sans-serif; fill: #0f2a63; }
    .process-title { font: 700 16px Arial, Helvetica, sans-serif; fill: #0f2a63; }
    .store-title { font: 700 15px Arial, Helvetica, sans-serif; fill: #0f2a63; }
    .store-text { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
    .flow { font: 400 12.5px Arial, Helvetica, sans-serif; fill: #1f2937; }
    .legend { font: 400 12px Arial, Helvetica, sans-serif; fill: #475569; }
    .line { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .store-line { stroke: #2563eb; stroke-width: 2.2; fill: none; }
  </style>

  <rect width="1600" height="1050" fill="#f8fbff"/>
  <text x="800" y="54" text-anchor="middle" class="title">Supervisor/Admin Data Flow Diagram</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">Gane and Sarson notation for management, monitoring, incident review, reporting, and notifications</text>

  <text x="205" y="118" text-anchor="middle" class="column">EXTERNAL ENTITY</text>
  <text x="590" y="118" text-anchor="middle" class="column">PROCESS</text>
  <text x="1235" y="118" text-anchor="middle" class="column">DATA STORE / SERVICE</text>

  <!-- Row 1: Authentication -->
  <g filter="url(#softShadow)">
    <rect x="70" y="145" width="270" height="82" fill="#eef2ff" stroke="#9fb4ff" stroke-width="2"/>
    <rect x="455" y="140" width="270" height="92" rx="28" fill="#ffffff" stroke="#3578ff" stroke-width="2"/>
  </g>
  <text x="205" y="179" text-anchor="middle" class="entity-title">Supervisor / Admin</text>
  <text x="205" y="202" text-anchor="middle" class="entity-text">Provides login credentials</text>
  <text x="480" y="168" class="process-num">1.0</text>
  <text x="590" y="177" text-anchor="middle" class="process-title">Authenticate</text>
  <text x="590" y="198" text-anchor="middle" class="process-title">Supervisor</text>
  <path class="store-line" d="M1110 152 H1495 M1110 218 H1495 M1110 152 V218"/>
  <text x="1130" y="179" class="store-title">D1</text>
  <text x="1184" y="179" class="store-title">Users and Guards</text>
  <line class="line" x1="340" y1="174" x2="455" y2="174"/>
  <text x="356" y="158" class="flow">Login credentials</text>
  <line class="line" x1="455" y1="204" x2="340" y2="204"/>
  <text x="356" y="224" class="flow">Access result</text>
  <line class="line" x1="725" y1="185" x2="1110" y2="185"/>
  <text x="825" y="169" class="flow">Supervisor account validation</text>

  <!-- Row 2: Management -->
  <g filter="url(#softShadow)">
    <rect x="70" y="280" width="270" height="92" fill="#eef2ff" stroke="#9fb4ff" stroke-width="2"/>
    <rect x="455" y="274" width="270" height="104" rx="28" fill="#ffffff" stroke="#3578ff" stroke-width="2"/>
  </g>
  <text x="205" y="317" text-anchor="middle" class="entity-title">Supervisor / Admin</text>
  <text x="205" y="341" text-anchor="middle" class="entity-text">Maintains system records</text>
  <text x="480" y="303" class="process-num">2.0</text>
  <text x="590" y="312" text-anchor="middle" class="process-title">Manage Guards</text>
  <text x="590" y="333" text-anchor="middle" class="process-title">and Checkpoints</text>
  <path class="store-line" d="M1110 282 H1495 M1110 364 H1495 M1110 282 V364"/>
  <text x="1130" y="309" class="store-title">D1-D2</text>
  <text x="1202" y="309" class="store-title">Guard and Checkpoint Records</text>
  <text x="1202" y="333" class="store-text">Stores account, RFID, location, and device data</text>
  <line class="line" x1="340" y1="313" x2="455" y2="313"/>
  <text x="356" y="297" class="flow">Manage data</text>
  <line class="line" x1="455" y1="350" x2="340" y2="350"/>
  <text x="356" y="371" class="flow">Saved record status</text>
  <line class="line" x1="725" y1="327" x2="1110" y2="327"/>
  <text x="812" y="310" class="flow">Create/update records</text>

  <!-- Row 3: Monitoring -->
  <g filter="url(#softShadow)">
    <rect x="70" y="420" width="270" height="92" fill="#eef2ff" stroke="#9fb4ff" stroke-width="2"/>
    <rect x="455" y="414" width="270" height="104" rx="28" fill="#ffffff" stroke="#3578ff" stroke-width="2"/>
  </g>
  <text x="205" y="457" text-anchor="middle" class="entity-title">Supervisor / Admin</text>
  <text x="205" y="481" text-anchor="middle" class="entity-text">Monitors patrol activity</text>
  <text x="480" y="443" class="process-num">3.0</text>
  <text x="590" y="452" text-anchor="middle" class="process-title">Monitor Patrols</text>
  <text x="590" y="473" text-anchor="middle" class="process-title">and Scan Issues</text>
  <path class="store-line" d="M1110 422 H1495 M1110 504 H1495 M1110 422 V504"/>
  <text x="1130" y="449" class="store-title">D3-D4</text>
  <text x="1202" y="449" class="store-title">Patrol Logs and Incident Reports</text>
  <text x="1202" y="473" class="store-text">Returns dashboard counts and scan issue details</text>
  <line class="line" x1="340" y1="453" x2="455" y2="453"/>
  <text x="356" y="437" class="flow">Dashboard filter</text>
  <line class="line" x1="455" y1="490" x2="340" y2="490"/>
  <text x="356" y="511" class="flow">Dashboard and scan issue records</text>
  <line class="line" x1="1110" y1="467" x2="725" y2="467"/>
  <text x="812" y="450" class="flow">Monitoring query result</text>

  <!-- Row 4: Incident review -->
  <g filter="url(#softShadow)">
    <rect x="70" y="560" width="270" height="92" fill="#eef2ff" stroke="#9fb4ff" stroke-width="2"/>
    <rect x="455" y="554" width="270" height="104" rx="28" fill="#ffffff" stroke="#3578ff" stroke-width="2"/>
  </g>
  <text x="205" y="597" text-anchor="middle" class="entity-title">Supervisor / Admin</text>
  <text x="205" y="621" text-anchor="middle" class="entity-text">Reviews incident reports</text>
  <text x="480" y="583" class="process-num">4.0</text>
  <text x="590" y="592" text-anchor="middle" class="process-title">Review Incident</text>
  <text x="590" y="613" text-anchor="middle" class="process-title">Reports</text>
  <path class="store-line" d="M1110 562 H1495 M1110 644 H1495 M1110 562 V644"/>
  <text x="1130" y="589" class="store-title">D4-D5</text>
  <text x="1202" y="589" class="store-title">Incident Reports and Audit Logs</text>
  <text x="1202" y="613" class="store-text">Updates review status and records activity</text>
  <line class="line" x1="340" y1="593" x2="455" y2="593"/>
  <text x="356" y="577" class="flow">Review update</text>
  <line class="line" x1="455" y1="630" x2="340" y2="630"/>
  <text x="356" y="651" class="flow">Review confirmation</text>
  <line class="line" x1="725" y1="607" x2="1110" y2="607"/>
  <text x="812" y="590" class="flow">Review update and audit entry</text>

  <!-- Row 5: Reports -->
  <g filter="url(#softShadow)">
    <rect x="70" y="700" width="270" height="92" fill="#eef2ff" stroke="#9fb4ff" stroke-width="2"/>
    <rect x="455" y="694" width="270" height="104" rx="28" fill="#ffffff" stroke="#3578ff" stroke-width="2"/>
  </g>
  <text x="205" y="737" text-anchor="middle" class="entity-title">Supervisor / Admin</text>
  <text x="205" y="761" text-anchor="middle" class="entity-text">Requests reports and exports</text>
  <text x="480" y="723" class="process-num">5.0</text>
  <text x="590" y="732" text-anchor="middle" class="process-title">Generate Reports</text>
  <text x="590" y="753" text-anchor="middle" class="process-title">and Audit Trail</text>
  <path class="store-line" d="M1110 702 H1495 M1110 784 H1495 M1110 702 V784"/>
  <text x="1130" y="729" class="store-title">D3-D5</text>
  <text x="1202" y="729" class="store-title">Logs, Incidents, and Audit Trail</text>
  <text x="1202" y="753" class="store-text">Returns filtered records for PDF generation</text>
  <line class="line" x1="340" y1="733" x2="455" y2="733"/>
  <text x="356" y="717" class="flow">Report request</text>
  <line class="line" x1="455" y1="770" x2="340" y2="770"/>
  <text x="356" y="791" class="flow">PDF reports</text>
  <line class="line" x1="1110" y1="747" x2="725" y2="747"/>
  <text x="812" y="730" class="flow">Filtered report data</text>

  <!-- Row 6: Notifications -->
  <g filter="url(#softShadow)">
    <rect x="70" y="848" width="270" height="92" fill="#fff3df" stroke="#ffc56b" stroke-width="2"/>
    <rect x="455" y="842" width="270" height="104" rx="28" fill="#ffffff" stroke="#3578ff" stroke-width="2"/>
  </g>
  <text x="205" y="883" text-anchor="middle" class="entity-title">Email / Web Push</text>
  <text x="205" y="905" text-anchor="middle" class="entity-title">Notification Services</text>
  <text x="205" y="926" text-anchor="middle" class="entity-text">Delivers supervisor alerts</text>
  <text x="480" y="871" class="process-num">6.0</text>
  <text x="590" y="880" text-anchor="middle" class="process-title">Send Supervisor</text>
  <text x="590" y="901" text-anchor="middle" class="process-title">Alerts</text>
  <path class="store-line" d="M1110 850 H1495 M1110 932 H1495 M1110 850 V932"/>
  <text x="1130" y="877" class="store-title">D6</text>
  <text x="1184" y="877" class="store-title">Push Subscriptions</text>
  <text x="1184" y="901" class="store-text">Stores browser endpoint and notification keys</text>
  <line class="line" x1="725" y1="876" x2="1110" y2="876"/>
  <text x="812" y="859" class="flow">Read subscriptions</text>
  <line class="line" x1="455" y1="912" x2="340" y2="912"/>
  <text x="356" y="936" class="flow">Alert payload</text>

  <!-- Legend -->
  <rect x="70" y="982" width="24" height="18" fill="#ffffff" stroke="#9fb4ff" stroke-width="1.5"/>
  <text x="102" y="996" class="legend">External Entity</text>
  <rect x="225" y="974" width="52" height="34" rx="12" fill="#ffffff" stroke="#3578ff" stroke-width="1.5"/>
  <text x="285" y="996" class="legend">Process</text>
  <path d="M385 977 H445 M385 1005 H445 M385 977 V1005" stroke="#2563eb" stroke-width="1.5" fill="none"/>
  <text x="455" y="996" class="legend">Data Store</text>
  <text x="735" y="996" class="legend">Note: Grouped data stores are used for readability while preserving Gane and Sarson symbols.</text>
</svg>
