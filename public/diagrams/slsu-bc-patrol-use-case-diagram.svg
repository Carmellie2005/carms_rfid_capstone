<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1250" viewBox="0 0 2200 1250" role="img" aria-labelledby="title desc">
  <title id="title">SLSU BC Patrol Use Case Diagram</title>
  <desc id="desc">Landscape use case diagram for SLSU BC Patrol showing Security Guard and Supervisor actors and their system use cases.</desc>
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .boundary { fill: #ffffff; stroke: #0f2a63; stroke-width: 2.5; }
    .boundary-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #0f2a63; }
    .actor-label { font: 700 18px Arial, Helvetica, sans-serif; fill: #0f2a63; }
    .usecase { fill: #f8fbff; stroke: #3578ff; stroke-width: 2.5; }
    .usecase-guard { fill: #f0fbf4; stroke: #59b378; stroke-width: 2.5; }
    .usecase-supervisor { fill: #f8fbff; stroke: #3578ff; stroke-width: 2.5; }
    .usecase-shared { fill: #fff7e6; stroke: #f59e0b; stroke-width: 2.5; }
    .text { font: 700 16px Arial, Helvetica, sans-serif; fill: #0f2a63; }
    .subtext { font: 400 13px Arial, Helvetica, sans-serif; fill: #334155; }
    .line { stroke: #1f2937; stroke-width: 2; fill: none; }
    .actor { stroke: #0f2a63; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .note { font: 400 13px Arial, Helvetica, sans-serif; fill: #475569; }
  </style>

  <rect width="2200" height="1250" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="385" y="80" width="1430" height="1060" rx="10" class="boundary"/>
  <text x="1100" y="122" text-anchor="middle" class="boundary-title">SLSU BC Patrol System</text>

  <!-- Actors -->
  <g transform="translate(180 470)">
    <circle cx="0" cy="0" r="32" class="actor"/>
    <path class="actor" d="M0 32 V145 M-70 75 H70 M0 145 L-62 238 M0 145 L62 238"/>
    <text x="0" y="292" text-anchor="middle" class="actor-label">Security Guard</text>
  </g>

  <g transform="translate(2020 470)">
    <circle cx="0" cy="0" r="32" class="actor"/>
    <path class="actor" d="M0 32 V145 M-70 75 H70 M0 145 L-62 238 M0 145 L62 238"/>
    <text x="0" y="292" text-anchor="middle" class="actor-label">Supervisor</text>
  </g>

  <!-- Shared use case -->
  <g filter="url(#softShadow)">
    <ellipse cx="1100" cy="210" rx="175" ry="56" class="usecase-shared"/>
  </g>
  <text x="1100" y="207" text-anchor="middle" class="text">Log in to system</text>
  <text x="1100" y="231" text-anchor="middle" class="subtext">authenticated access</text>

  <!-- Guard use cases -->
  <g filter="url(#softShadow)">
    <ellipse cx="690" cy="360" rx="180" ry="58" class="usecase-guard"/>
    <ellipse cx="690" cy="515" rx="205" ry="64" class="usecase-guard"/>
    <ellipse cx="690" cy="680" rx="185" ry="58" class="usecase-guard"/>
    <ellipse cx="690" cy="835" rx="190" ry="58" class="usecase-guard"/>
    <ellipse cx="690" cy="990" rx="180" ry="58" class="usecase-guard"/>
  </g>

  <text x="690" y="355" text-anchor="middle" class="text">Scan RFID checkpoint</text>
  <text x="690" y="379" text-anchor="middle" class="subtext">record checkpoint visit</text>

  <text x="690" y="506" text-anchor="middle" class="text">Submit patrol</text>
  <text x="690" y="529" text-anchor="middle" class="text">documentation</text>
  <text x="690" y="552" text-anchor="middle" class="subtext">GPS, area selfie, checklist</text>

  <text x="690" y="675" text-anchor="middle" class="text">Submit incident report</text>
  <text x="690" y="699" text-anchor="middle" class="subtext">details and supporting image</text>

  <text x="690" y="830" text-anchor="middle" class="text">View own patrol records</text>
  <text x="690" y="854" text-anchor="middle" class="subtext">patrol history and status</text>

  <text x="690" y="985" text-anchor="middle" class="text">Receive scan feedback</text>
  <text x="690" y="1009" text-anchor="middle" class="subtext">success, error, or pending status</text>

  <!-- Supervisor use cases -->
  <g filter="url(#softShadow)">
    <ellipse cx="1510" cy="360" rx="170" ry="58" class="usecase-supervisor"/>
    <ellipse cx="1510" cy="500" rx="180" ry="58" class="usecase-supervisor"/>
    <ellipse cx="1510" cy="640" rx="190" ry="58" class="usecase-supervisor"/>
    <ellipse cx="1510" cy="780" rx="205" ry="58" class="usecase-supervisor"/>
    <ellipse cx="1510" cy="920" rx="180" ry="58" class="usecase-supervisor"/>
    <ellipse cx="1510" cy="1060" rx="185" ry="58" class="usecase-supervisor"/>
  </g>

  <text x="1510" y="355" text-anchor="middle" class="text">View dashboard</text>
  <text x="1510" y="379" text-anchor="middle" class="subtext">system activity overview</text>

  <text x="1510" y="495" text-anchor="middle" class="text">Monitor patrol logs</text>
  <text x="1510" y="519" text-anchor="middle" class="subtext">completed and pending patrols</text>

  <text x="1510" y="635" text-anchor="middle" class="text">Review incident reports</text>
  <text x="1510" y="659" text-anchor="middle" class="subtext">inspect submitted incidents</text>

  <text x="1510" y="775" text-anchor="middle" class="text">Manage guards</text>
  <text x="1510" y="798" text-anchor="middle" class="text">and checkpoints</text>
  <text x="1510" y="821" text-anchor="middle" class="subtext">system records maintenance</text>

  <text x="1510" y="915" text-anchor="middle" class="text">Generate PDF reports</text>
  <text x="1510" y="939" text-anchor="middle" class="subtext">patrol, incident, audit trail</text>

  <text x="1510" y="1055" text-anchor="middle" class="text">Receive notifications</text>
  <text x="1510" y="1079" text-anchor="middle" class="subtext">web push or email alerts</text>

  <!-- Associations: Security Guard -->
  <path class="line" d="M250 545 H492"/>
  <path class="line" d="M250 545 C360 415 465 245 930 210"/>
  <path class="line" d="M250 545 C385 520 452 515 485 515"/>
  <path class="line" d="M250 545 C390 610 470 665 510 680"/>
  <path class="line" d="M250 545 C390 720 470 810 505 835"/>
  <path class="line" d="M250 545 C380 820 470 960 512 990"/>

  <!-- Associations: Supervisor -->
  <path class="line" d="M1950 545 C1810 410 1700 235 1275 210"/>
  <path class="line" d="M1950 545 C1815 395 1730 365 1680 360"/>
  <path class="line" d="M1950 545 C1835 512 1740 502 1690 500"/>
  <path class="line" d="M1950 545 C1830 590 1740 625 1698 640"/>
  <path class="line" d="M1950 545 C1810 705 1740 762 1715 780"/>
  <path class="line" d="M1950 545 C1810 830 1730 900 1690 920"/>
  <path class="line" d="M1950 545 C1805 950 1735 1030 1695 1060"/>

  <!-- Small legend -->
  <g transform="translate(430 1185)">
    <ellipse cx="80" cy="0" rx="76" ry="27" class="usecase-shared"/>
    <text x="80" y="5" text-anchor="middle" class="note">Shared use case</text>
    <ellipse cx="300" cy="0" rx="76" ry="27" class="usecase-guard"/>
    <text x="300" y="5" text-anchor="middle" class="note">Guard use case</text>
    <ellipse cx="520" cy="0" rx="86" ry="27" class="usecase-supervisor"/>
    <text x="520" y="5" text-anchor="middle" class="note">Supervisor use case</text>
    <line x1="680" y1="0" x2="770" y2="0" class="line"/>
    <text x="870" y="5" text-anchor="middle" class="note">Actor association</text>
  </g>
</svg>
