<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">SLSU Bontoc Patrol Client-Server Architecture Diagram</title>
  <desc id="desc">Client-server architecture diagram showing security guard and supervisor clients, five Wi-Fi RFID checkpoint devices, campus Wi-Fi, internet, cloud Laravel server, MySQL database, photo storage, and alerts.</desc>
  <defs>
    <style>
      .page { fill: #f8fafc; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 38px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #475569; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .zone-title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 800; fill: #1e3a8a; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2.2; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .green { fill: #ecfdf5; stroke: #059669; }
      .orange { fill: #fff7ed; stroke: #ea580c; }
      .purple { fill: #f5f3ff; stroke: #7c3aed; }
      .dark { fill: #0f172a; stroke: #334155; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 800; fill: #0f172a; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #475569; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #64748b; }
      .dark-label { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; }
      .dark-small { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #cbd5e1; }
      .actor-line { stroke: #0f172a; stroke-width: 4; stroke-linecap: round; fill: none; }
      .actor-text { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .arrow-orange { stroke: #ea580c; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
      .dashed { stroke-dasharray: 9 8; }
      .callout { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #334155; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c" />
    </marker>
  </defs>

  <rect class="page" width="1800" height="1080" />
  <text class="title" x="900" y="58" text-anchor="middle">Client-Server Architecture Diagram</text>
  <text class="subtitle" x="900" y="92" text-anchor="middle">SLSU Bontoc Patrol System</text>

  <rect class="zone" x="55" y="135" width="425" height="820" rx="22" />
  <text class="zone-title" x="90" y="178">Client Side</text>

  <rect class="zone" x="525" y="135" width="540" height="820" rx="22" />
  <text class="zone-title" x="560" y="178">Campus Network</text>

  <rect class="zone" x="1110" y="135" width="635" height="820" rx="22" />
  <text class="zone-title" x="1145" y="178">Cloud / Server Side</text>

  <g id="guard">
    <circle class="actor-line" cx="130" cy="287" r="27" />
    <path class="actor-line" d="M 130 314 L 130 395 M 85 342 L 175 342 M 130 395 L 94 450 M 130 395 L 166 450" />
    <text class="actor-text" x="130" y="485">Security Guard</text>

    <rect class="box green" x="240" y="220" width="190" height="140" rx="20" />
    <rect x="292" y="240" width="86" height="98" rx="14" fill="#0f172a" />
    <rect x="304" y="254" width="62" height="66" rx="7" fill="#e0f2fe" />
    <circle cx="335" cy="329" r="5" fill="#cbd5e1" />
    <text class="label" x="335" y="397" text-anchor="middle">Guard Phone</text>
    <text class="small" x="335" y="425" text-anchor="middle">PWA / Browser</text>
    <text class="tiny" x="335" y="450" text-anchor="middle">camera, GPS, checklist</text>
  </g>

  <g id="supervisor">
    <circle class="actor-line" cx="130" cy="652" r="27" />
    <path class="actor-line" d="M 130 679 L 130 760 M 85 707 L 175 707 M 130 760 L 94 815 M 130 760 L 166 815" />
    <text class="actor-text" x="130" y="850">Supervisor</text>

    <rect class="box blue" x="240" y="590" width="190" height="145" rx="20" />
    <rect x="279" y="618" width="112" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" />
    <path d="M 306 705 L 364 705 L 380 722 L 290 722 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" />
    <text class="label" x="335" y="772" text-anchor="middle">Supervisor</text>
    <text class="small" x="335" y="800" text-anchor="middle">Dashboard / Reports</text>
    <text class="tiny" x="335" y="825" text-anchor="middle">logs, incidents, alerts</text>
  </g>

  <g id="router">
    <rect class="box orange" x="675" y="220" width="240" height="145" rx="22" />
    <path d="M 735 276 C 770 240, 820 240, 855 276" stroke="#ea580c" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M 758 301 C 777 283, 813 283, 832 301" stroke="#ea580c" stroke-width="8" fill="none" stroke-linecap="round" />
    <circle cx="795" cy="326" r="10" fill="#ea580c" />
    <text class="label" x="795" y="405" text-anchor="middle">Wi-Fi Router</text>
    <text class="small" x="795" y="432" text-anchor="middle">Campus network</text>
  </g>

  <g id="devices">
    <rect class="box green" x="585" y="525" width="420" height="340" rx="22" />
    <text class="label" x="795" y="570" text-anchor="middle">5 RFID Checkpoint Devices</text>
    <text class="small" x="795" y="598" text-anchor="middle">ESP32 readers connected through Wi-Fi</text>

    <rect class="box" x="625" y="635" width="115" height="75" rx="13" />
    <text class="label" x="682" y="666" text-anchor="middle">CP-01</text>
    <text class="tiny" x="682" y="690" text-anchor="middle">RFID reader</text>

    <rect class="box" x="795" y="635" width="115" height="75" rx="13" />
    <text class="label" x="852" y="666" text-anchor="middle">CP-02</text>
    <text class="tiny" x="852" y="690" text-anchor="middle">RFID reader</text>

    <rect class="box" x="625" y="735" width="115" height="75" rx="13" />
    <text class="label" x="682" y="766" text-anchor="middle">CP-03</text>
    <text class="tiny" x="682" y="790" text-anchor="middle">RFID reader</text>

    <rect class="box" x="795" y="735" width="115" height="75" rx="13" />
    <text class="label" x="852" y="766" text-anchor="middle">CP-04</text>
    <text class="tiny" x="852" y="790" text-anchor="middle">RFID reader</text>

    <rect class="box" x="710" y="815" width="115" height="75" rx="13" />
    <text class="label" x="767" y="846" text-anchor="middle">CP-05</text>
    <text class="tiny" x="767" y="870" text-anchor="middle">RFID reader</text>
  </g>

  <g id="server-side">
    <rect class="box blue" x="1230" y="230" width="270" height="115" rx="22" />
    <text class="label" x="1365" y="276" text-anchor="middle">Internet</text>
    <text class="small" x="1365" y="304" text-anchor="middle">HTTPS connection</text>

    <rect class="box dark" x="1220" y="455" width="330" height="170" rx="24" />
    <text class="dark-label" x="1385" y="505" text-anchor="middle">Cloud Web Server</text>
    <text class="dark-small" x="1385" y="538" text-anchor="middle">Laravel application</text>
    <text class="dark-small" x="1385" y="567" text-anchor="middle">Authentication, roles, API</text>
    <text class="dark-small" x="1385" y="596" text-anchor="middle">Patrol logs and incidents</text>

    <rect class="box blue" x="1170" y="755" width="205" height="125" rx="20" />
    <text class="label" x="1272" y="800" text-anchor="middle">MySQL</text>
    <text class="small" x="1272" y="829" text-anchor="middle">users, guards,</text>
    <text class="small" x="1272" y="855" text-anchor="middle">logs, reports</text>

    <rect class="box purple" x="1425" y="755" width="230" height="125" rx="20" />
    <text class="label" x="1540" y="800" text-anchor="middle">Photo Storage</text>
    <text class="small" x="1540" y="829" text-anchor="middle">selfies, proof photos,</text>
    <text class="small" x="1540" y="855" text-anchor="middle">incident evidence</text>

    <rect class="box orange" x="1585" y="455" width="130" height="170" rx="24" />
    <text class="label" x="1650" y="505" text-anchor="middle">Alerts</text>
    <text class="small" x="1650" y="538" text-anchor="middle">scan issues</text>
    <text class="small" x="1650" y="567" text-anchor="middle">incidents</text>
    <text class="small" x="1650" y="596" text-anchor="middle">review</text>
  </g>

  <g id="connections">
    <path class="arrow-blue" d="M 430 290 L 675 290" />
    <text class="callout" x="485" y="268">guard PWA</text>

    <path class="arrow-blue" d="M 430 660 C 540 590, 610 410, 675 332" />
    <text class="callout" x="485" y="623">supervisor dashboard</text>

    <path class="arrow-green" d="M 795 525 L 795 365" />
    <text class="callout" x="815" y="487">RFID scan data</text>

    <path class="arrow-orange" d="M 915 292 L 1230 292" />
    <text class="callout" x="1010" y="270">Wi-Fi to internet</text>

    <path class="arrow-blue" d="M 1365 345 L 1365 455" />
    <text class="callout" x="1388" y="404">HTTP API</text>

    <path class="arrow-blue" d="M 1352 625 L 1288 755" />
    <text class="callout" x="1232" y="699">read/write data</text>

    <path class="arrow-blue" d="M 1427 625 L 1517 755" />
    <text class="callout" x="1528" y="699">upload images</text>

    <path class="arrow-orange" d="M 1550 540 L 1585 540" />
    <text class="callout" x="1556" y="518">send</text>

    <path class="arrow-orange dashed" d="M 1650 455 C 1550 165, 660 130, 390 590" />
    <text class="callout" x="1225" y="190">important alerts can reach supervisor device</text>
  </g>

  <g id="legend">
    <rect x="100" y="895" width="330" height="44" rx="12" fill="#eff6ff" stroke="#bfdbfe" />
    <text class="tiny" x="120" y="923">Blue: PWA requests, API responses, database access</text>

    <rect x="610" y="895" width="300" height="44" rx="12" fill="#ecfdf5" stroke="#bbf7d0" />
    <text class="tiny" x="630" y="923">Green: RFID checkpoint scan data</text>

    <rect x="1200" y="895" width="385" height="44" rx="12" fill="#fff7ed" stroke="#fed7aa" />
    <text class="tiny" x="1220" y="923">Orange: network path and notification/alert flow</text>
  </g>
</svg>
