<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">SLSU BC Patrol System Context Diagram</title>
  <desc id="desc">Context diagram showing Security Guard, ESP32 RFID Checkpoint Device, Supervisor or Admin, and Email or Web Push Services interacting with the SLSU BC Patrol System.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#f8fbff"/>

  <text x="700" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0f2a63">
    SLSU BC Patrol System Context Diagram
  </text>
  <text x="700" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526173">
    RFID-based checkpoint patrol monitoring, incident documentation, reporting, and supervisor alerts
  </text>

  <!-- External entities -->
  <g filter="url(#softShadow)">
    <rect x="585" y="125" width="230" height="96" rx="8" fill="#dff0ff" stroke="#8cc5ff" stroke-width="2"/>
    <rect x="90" y="370" width="265" height="120" rx="8" fill="#eaf7ef" stroke="#8fd0a4" stroke-width="2"/>
    <rect x="1045" y="365" width="270" height="130" rx="8" fill="#eef2ff" stroke="#9fb4ff" stroke-width="2"/>
    <rect x="570" y="700" width="260" height="110" rx="8" fill="#fff3df" stroke="#ffc56b" stroke-width="2"/>
  </g>

  <text x="700" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f2a63">Security Guard</text>
  <text x="700" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Scans checkpoint and submits patrol documentation</text>

  <text x="222.5" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#14532d">ESP32 RFID</text>
  <text x="222.5" y="433" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#14532d">Checkpoint Device</text>
  <text x="222.5" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Reads RFID cards at campus checkpoints</text>

  <text x="1180" y="403" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e1b4b">Supervisor / Admin</text>
  <text x="1180" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Monitors patrols, manages records,</text>
  <text x="1180" y="451" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">reviews incidents, and exports reports</text>

  <text x="700" y="740" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Email / Web Push</text>
  <text x="700" y="765" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#7c2d12">Notification Services</text>
  <text x="700" y="790" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Delivers incident and scan issue alerts</text>

  <!-- Main system -->
  <circle cx="700" cy="440" r="110" fill="#bfe3ff" stroke="#3578ff" stroke-width="4" filter="url(#softShadow)"/>
  <text x="700" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f2a63">SLSU BC Patrol</text>
  <text x="700" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f2a63">System</text>
  <text x="700" y="471" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e3a8a">Patrol logs • Incidents • Audit trail</text>

  <!-- Guard flows -->
  <line x1="665" y1="221" x2="665" y2="332" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="735" y1="334" x2="735" y2="221" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">
    <tspan x="452" dy="0">Login credentials, checklist,</tspan>
    <tspan x="452" dy="17">area selfie, incident details</tspan>
  </text>
  <text x="765" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">
    <tspan x="765" dy="0">Scan feedback, patrol status,</tspan>
    <tspan x="765" dy="17">own patrol records</tspan>
  </text>

  <!-- RFID device flows -->
  <line x1="355" y1="410" x2="588" y2="410" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="470" x2="355" y2="470" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">
    <tspan x="385" dy="0">RFID UID, checkpoint code,</tspan>
    <tspan x="385" dy="17">device ID, scan timestamp</tspan>
  </text>
  <text x="385" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">
    <tspan x="385" dy="0">Accepted / invalid scan response,</tspan>
    <tspan x="385" dy="17">guard name, status message</tspan>
  </text>

  <!-- Supervisor/Admin flows -->
  <line x1="1045" y1="412" x2="812" y2="412" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="470" x2="1045" y2="470" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="842" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">
    <tspan x="842" dy="0">Manage guards/checkpoints,</tspan>
    <tspan x="842" dy="17">review incidents, filter reports</tspan>
  </text>
  <text x="842" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">
    <tspan x="842" dy="0">Dashboard summaries, audit trail,</tspan>
    <tspan x="842" dy="17">PDF reports, scan issue records</tspan>
  </text>

  <!-- Notification service flows -->
  <line x1="665" y1="545" x2="665" y2="700" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="735" y1="700" x2="735" y2="545" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="625" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">
    <tspan x="418" dy="0">Incident and patrol scan alert</tspan>
    <tspan x="418" dy="17">notification payloads</tspan>
  </text>
  <text x="765" y="625" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">
    <tspan x="765" dy="0">Browser push delivery and</tspan>
    <tspan x="765" dy="17">subscription status</tspan>
  </text>
</svg>
