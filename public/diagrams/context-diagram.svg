<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Context Diagram for SLSU BC Patrol</title>
  <desc id="desc">Context diagram showing how security guards, supervisors, ESP32 RFID checkpoint devices, notification services, and storage interact with the SLSU BC Patrol system.</desc>

  <defs>
    <style>
      .bg { fill: #f8fbff; }
      .title { fill: #102a63; font: 800 42px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #475569; font: 400 21px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .system { fill: #eaf4ff; stroke: #2563eb; stroke-width: 4; }
      .entity { fill: #ffffff; stroke: #8ec5ff; stroke-width: 3; }
      .device { fill: #effdf6; stroke: #10b981; stroke-width: 3; }
      .service { fill: #fff7ed; stroke: #f59e0b; stroke-width: 3; }
      .storage { fill: #f8fafc; stroke: #64748b; stroke-width: 3; }
      .heading { fill: #102a63; font: 800 24px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .small { fill: #475569; font: 400 17px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .flow { fill: #334155; font: 700 15px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.8; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 2.8; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 2.8; marker-end: url(#arrow-green); }
      .arrow-orange { fill: none; stroke: #d97706; stroke-width: 2.8; marker-end: url(#arrow-orange); }
      .shadow { filter: url(#shadow); }
    </style>

    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706" />
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1000" />

  <text class="title" x="800" y="78" text-anchor="middle">Context Diagram</text>
  <text class="subtitle" x="800" y="112" text-anchor="middle">SLSU BC Patrol: RFID-Based Security Patrol Monitoring System</text>

  <g class="shadow">
    <rect class="entity" x="95" y="230" width="300" height="150" rx="8" />
    <text class="heading" x="245" y="284" text-anchor="middle">Supervisor / Admin</text>
    <text class="small" x="245" y="320" text-anchor="middle">Manages guards, checkpoints,</text>
    <text class="small" x="245" y="346" text-anchor="middle">incidents, reports, and audits</text>
  </g>

  <g class="shadow">
    <rect class="entity" x="95" y="620" width="300" height="150" rx="8" />
    <text class="heading" x="245" y="674" text-anchor="middle">Security Guard</text>
    <text class="small" x="245" y="710" text-anchor="middle">Scans RFID, submits selfie,</text>
    <text class="small" x="245" y="736" text-anchor="middle">checklist, GPS, and incidents</text>
  </g>

  <g class="shadow">
    <rect class="device" x="1205" y="230" width="300" height="150" rx="8" />
    <text class="heading" x="1355" y="284" text-anchor="middle">ESP32 RFID Device</text>
    <text class="small" x="1355" y="320" text-anchor="middle">Reads RFID card UID and</text>
    <text class="small" x="1355" y="346" text-anchor="middle">sends checkpoint scan data</text>
  </g>

  <g class="shadow">
    <rect class="service" x="1205" y="620" width="300" height="150" rx="8" />
    <text class="heading" x="1355" y="674" text-anchor="middle">Browser Push Service</text>
    <text class="small" x="1355" y="710" text-anchor="middle">Delivers web push alerts</text>
    <text class="small" x="1355" y="736" text-anchor="middle">to supervisor browsers</text>
  </g>

  <g class="shadow">
    <path class="storage" d="M625 800 C625 766, 975 766, 975 800 L975 895 C975 929, 625 929, 625 895 Z" />
    <ellipse class="storage" cx="800" cy="800" rx="175" ry="34" />
    <text class="heading" x="800" y="846" text-anchor="middle">Database and File Storage</text>
    <text class="small" x="800" y="880" text-anchor="middle">Users, patrol logs, photos, GPS,</text>
    <text class="small" x="800" y="906" text-anchor="middle">incidents, audit trails, and reports</text>
  </g>

  <g class="shadow">
    <circle class="system" cx="800" cy="485" r="148" />
    <text class="heading" x="800" y="430" text-anchor="middle">SLSU BC Patrol</text>
    <text class="heading" x="800" y="462" text-anchor="middle">System</text>
    <text class="small" x="800" y="502" text-anchor="middle">RFID patrol monitoring,</text>
    <text class="small" x="800" y="528" text-anchor="middle">incident documentation,</text>
    <text class="small" x="800" y="554" text-anchor="middle">notifications, and PDF reports</text>
  </g>

  <path class="arrow-blue" d="M395 285 C500 300, 595 360, 674 415" />
  <text class="flow" x="515" y="292" text-anchor="middle">management inputs</text>
  <text class="flow" x="520" y="314" text-anchor="middle">report filters</text>

  <path class="arrow" d="M670 462 C560 430, 500 382, 395 345" />
  <text class="flow" x="523" y="420" text-anchor="middle">dashboards, logs,</text>
  <text class="flow" x="523" y="442" text-anchor="middle">PDF reports, alerts</text>

  <path class="arrow-blue" d="M395 708 C505 690, 598 626, 679 556" />
  <text class="flow" x="522" y="686" text-anchor="middle">selfie, checklist, GPS,</text>
  <text class="flow" x="522" y="708" text-anchor="middle">incident details</text>

  <path class="arrow" d="M678 603 C560 635, 500 676, 395 728" />
  <text class="flow" x="520" y="640" text-anchor="middle">scan result, patrol status,</text>
  <text class="flow" x="520" y="662" text-anchor="middle">own patrol records</text>

  <path class="arrow-green" d="M1205 302 C1090 318, 1002 372, 925 423" />
  <text class="flow" x="1083" y="296" text-anchor="middle">RFID UID, device ID,</text>
  <text class="flow" x="1083" y="318" text-anchor="middle">checkpoint code</text>

  <path class="arrow" d="M926 466 C1044 432, 1102 382, 1205 350" />
  <text class="flow" x="1087" y="420" text-anchor="middle">validation result</text>
  <text class="flow" x="1087" y="442" text-anchor="middle">LCD/buzzer message</text>

  <path class="arrow-orange" d="M935 547 C1035 590, 1117 642, 1205 682" />
  <text class="flow" x="1085" y="612" text-anchor="middle">incident and scan</text>
  <text class="flow" x="1085" y="634" text-anchor="middle">push payload</text>

  <path class="arrow-orange" d="M1205 724 C930 747, 577 690, 395 346" />
  <text class="flow" x="1052" y="762" text-anchor="middle">browser notification</text>

  <path class="arrow-blue" d="M760 631 C736 692, 728 735, 742 771" />
  <text class="flow" x="664" y="710" text-anchor="middle">store records, photos,</text>
  <text class="flow" x="664" y="732" text-anchor="middle">audit trails</text>

  <path class="arrow" d="M858 772 C882 712, 883 674, 853 631" />
  <text class="flow" x="953" y="710" text-anchor="middle">retrieve logs, evidence,</text>
  <text class="flow" x="953" y="732" text-anchor="middle">and report data</text>
</svg>
