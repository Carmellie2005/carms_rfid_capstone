<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">SLSU Bontoc Patrol Use Case Diagram</title>
  <desc id="desc">Use case diagram for the SLSU Bontoc Patrol System with two actors: Supervisor and Security Guard.</desc>
  <defs>
    <style>
      .page { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #94a3b8; stroke-width: 3; }
      .section { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.5; }
      .section-title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #334155; letter-spacing: 0.5px; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 38px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 21px; fill: #475569; }
      .actor-line { stroke: #0f172a; stroke-width: 4; stroke-linecap: round; fill: none; }
      .actor-text { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .link { stroke: #64748b; stroke-width: 2.3; fill: none; }
      .include { stroke: #2563eb; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow-blue); }
      .extend { stroke: #0891b2; stroke-width: 2; fill: none; stroke-dasharray: 5 6; marker-end: url(#arrow-teal); }
      .uc-guard { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; }
      .uc-supervisor { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.2; }
      .uc-shared { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; }
      .uc-text { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #2563eb; text-anchor: middle; }
      .note-teal { fill: #0891b2; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2" />
    </marker>
  </defs>

  <rect class="page" width="1800" height="1250" />
  <text class="title" x="900" y="54" text-anchor="middle">Use Case Diagram</text>
  <text class="subtitle" x="900" y="86" text-anchor="middle">SLSU Bontoc Patrol System</text>

  <rect class="boundary" x="290" y="115" width="1220" height="1070" rx="18" />
  <text class="section-title" x="900" y="152" text-anchor="middle">System Boundary</text>

  <rect class="section" x="330" y="180" width="1140" height="175" rx="14" />
  <text class="section-title" x="360" y="216">Shared Access</text>

  <rect class="section" x="330" y="385" width="540" height="750" rx="14" />
  <text class="section-title" x="360" y="421">Security Guard</text>

  <rect class="section" x="930" y="385" width="540" height="750" rx="14" />
  <text class="section-title" x="960" y="421">Supervisor</text>

  <g id="security-guard" transform="translate(145 610)">
    <circle class="actor-line" cx="0" cy="-70" r="30" />
    <path class="actor-line" d="M 0 -40 L 0 55 M -58 -8 L 58 -8 M 0 55 L -50 132 M 0 55 L 50 132" />
    <text class="actor-text" x="0" y="190">Security Guard</text>
  </g>

  <g id="supervisor" transform="translate(1655 610)">
    <circle class="actor-line" cx="0" cy="-70" r="30" />
    <path class="actor-line" d="M 0 -40 L 0 55 M -58 -8 L 58 -8 M 0 55 L -50 132 M 0 55 L 50 132" />
    <text class="actor-text" x="0" y="190">Supervisor</text>
  </g>

  <g id="shared-use-cases">
    <ellipse class="uc-shared" cx="540" cy="270" rx="115" ry="42" />
    <text class="uc-text" x="540" y="270">Log In</text>

    <ellipse class="uc-shared" cx="815" cy="270" rx="150" ry="42" />
    <text class="uc-text" x="815" y="270">Manage Profile</text>

    <ellipse class="uc-shared" cx="1135" cy="270" rx="150" ry="42" />
    <text class="uc-text" x="1135" y="270">View Notifications</text>

    <ellipse class="uc-shared" cx="1355" cy="270" rx="105" ry="42" />
    <text class="uc-text" x="1355" y="261">
      <tspan x="1355" dy="0">Mark as</tspan>
      <tspan x="1355" dy="23">Read</tspan>
    </text>
  </g>

  <g id="guard-use-cases">
    <ellipse class="uc-guard" cx="565" cy="500" rx="145" ry="44" />
    <text class="uc-text" x="565" y="500">Scan Checkpoint</text>

    <ellipse class="uc-guard" cx="565" cy="628" rx="130" ry="42" />
    <text class="uc-text" x="565" y="628">Scan RFID Card</text>

    <ellipse class="uc-guard" cx="565" cy="745" rx="165" ry="48" />
    <text class="uc-text" x="565" y="733">
      <tspan x="565" dy="0">Take Area Selfie</tspan>
      <tspan x="565" dy="24">with GPS Stamp</tspan>
    </text>

    <ellipse class="uc-guard" cx="565" cy="875" rx="165" ry="48" />
    <text class="uc-text" x="565" y="863">
      <tspan x="565" dy="0">Complete Patrol</tspan>
      <tspan x="565" dy="24">Checklist</tspan>
    </text>

    <ellipse class="uc-guard" cx="565" cy="1005" rx="160" ry="48" />
    <text class="uc-text" x="565" y="993">
      <tspan x="565" dy="0">Submit Patrol</tspan>
      <tspan x="565" dy="24">Record</tspan>
    </text>

    <ellipse class="uc-guard" cx="780" cy="628" rx="118" ry="42" />
    <text class="uc-text" x="780" y="616">
      <tspan x="780" dy="0">Submit Incident</tspan>
      <tspan x="780" dy="23">Report</tspan>
    </text>

    <ellipse class="uc-guard" cx="780" cy="875" rx="122" ry="45" />
    <text class="uc-text" x="780" y="863">
      <tspan x="780" dy="0">Attach Proof</tspan>
      <tspan x="780" dy="23">Photos</tspan>
    </text>

    <ellipse class="uc-guard" cx="780" cy="1005" rx="118" ry="42" />
    <text class="uc-text" x="780" y="993">
      <tspan x="780" dy="0">View My</tspan>
      <tspan x="780" dy="23">Patrol Logs</tspan>
    </text>

    <ellipse class="uc-guard" cx="780" cy="1102" rx="120" ry="42" />
    <text class="uc-text" x="780" y="1090">
      <tspan x="780" dy="0">Download Own</tspan>
      <tspan x="780" dy="23">PDF</tspan>
    </text>
  </g>

  <g id="supervisor-use-cases">
    <ellipse class="uc-supervisor" cx="1115" cy="480" rx="132" ry="42" />
    <text class="uc-text" x="1115" y="480">View Dashboard</text>

    <ellipse class="uc-supervisor" cx="1348" cy="480" rx="122" ry="42" />
    <text class="uc-text" x="1348" y="468">
      <tspan x="1348" dy="0">Review Scan</tspan>
      <tspan x="1348" dy="23">Issues</tspan>
    </text>

    <ellipse class="uc-supervisor" cx="1115" cy="600" rx="150" ry="45" />
    <text class="uc-text" x="1115" y="588">
      <tspan x="1115" dy="0">Manage Guard</tspan>
      <tspan x="1115" dy="23">Profiles</tspan>
    </text>

    <ellipse class="uc-supervisor" cx="1348" cy="600" rx="122" ry="45" />
    <text class="uc-text" x="1348" y="588">
      <tspan x="1348" dy="0">Add / Edit /</tspan>
      <tspan x="1348" dy="23">Delete Guards</tspan>
    </text>

    <ellipse class="uc-supervisor" cx="1115" cy="730" rx="148" ry="45" />
    <text class="uc-text" x="1115" y="718">
      <tspan x="1115" dy="0">Manage</tspan>
      <tspan x="1115" dy="23">Checkpoints</tspan>
    </text>

    <ellipse class="uc-supervisor" cx="1348" cy="730" rx="122" ry="45" />
    <text class="uc-text" x="1348" y="718">
      <tspan x="1348" dy="0">Add / Edit /</tspan>
      <tspan x="1348" dy="23">Delete Points</tspan>
    </text>

    <ellipse class="uc-supervisor" cx="1115" cy="860" rx="145" ry="45" />
    <text class="uc-text" x="1115" y="848">
      <tspan x="1115" dy="0">Monitor Patrol</tspan>
      <tspan x="1115" dy="23">Logs</tspan>
    </text>

    <ellipse class="uc-supervisor" cx="1348" cy="860" rx="130" ry="47" />
    <text class="uc-text" x="1348" y="847">
      <tspan x="1348" dy="0">View Details,</tspan>
      <tspan x="1348" dy="23">Checklist, Photos</tspan>
    </text>

    <ellipse class="uc-supervisor" cx="1115" cy="990" rx="145" ry="45" />
    <text class="uc-text" x="1115" y="978">
      <tspan x="1115" dy="0">Review Incident</tspan>
      <tspan x="1115" dy="23">Reports</tspan>
    </text>

    <ellipse class="uc-supervisor" cx="1348" cy="990" rx="130" ry="45" />
    <text class="uc-text" x="1348" y="978">
      <tspan x="1348" dy="0">Update Incident</tspan>
      <tspan x="1348" dy="23">Status</tspan>
    </text>

    <ellipse class="uc-supervisor" cx="1115" cy="1100" rx="128" ry="42" />
    <text class="uc-text" x="1115" y="1100">Generate Reports</text>

    <ellipse class="uc-supervisor" cx="1348" cy="1100" rx="130" ry="42" />
    <text class="uc-text" x="1348" y="1089">
      <tspan x="1348" dy="0">Filter Dates /</tspan>
      <tspan x="1348" dy="22">Download PDF</tspan>
    </text>
  </g>

  <g id="actor-links">
    <path class="link" d="M 205 602 C 300 510, 390 500, 420 500" />
    <path class="link" d="M 205 602 C 330 280, 430 270, 425 270" />
    <path class="link" d="M 205 602 C 405 312, 660 270, 665 270" />
    <path class="link" d="M 205 602 C 500 350, 930 270, 985 270" />
    <path class="link" d="M 205 602 C 345 900, 620 1005, 662 1005" />
    <path class="link" d="M 205 602 C 350 980, 650 1102, 660 1102" />

    <path class="link" d="M 1595 602 C 1490 495, 1450 480, 1470 480" />
    <path class="link" d="M 1595 602 C 1500 600, 1290 600, 1265 600" />
    <path class="link" d="M 1595 602 C 1480 735, 1285 730, 1263 730" />
    <path class="link" d="M 1595 602 C 1480 865, 1290 860, 1260 860" />
    <path class="link" d="M 1595 602 C 1470 985, 1290 990, 1260 990" />
    <path class="link" d="M 1595 602 C 1445 1090, 1260 1100, 1243 1100" />
    <path class="link" d="M 1595 602 C 1460 310, 1255 270, 1285 270" />
    <path class="link" d="M 1595 602 C 1400 290, 925 270, 965 270" />
    <path class="link" d="M 1595 602 C 1320 280, 665 270, 655 270" />
  </g>

  <g id="relationships">
    <path class="include" d="M 1248 270 L 1255 270" />
