    <path class="include" d="M 565 544 L 565 586" />
    <text class="note" x="646" y="575">&lt;&lt;include&gt;&gt;</text>
    <path class="include" d="M 565 544 L 565 697" />
    <path class="include" d="M 565 544 L 565 827" />
    <path class="include" d="M 565 544 L 565 957" />
    <path class="extend" d="M 690 875 L 730 875" />
    <text class="note note-teal" x="710" y="854">&lt;&lt;extend&gt;&gt;</text>
    <path class="extend" d="M 700 628 C 650 585, 620 545, 605 528" />
    <text class="note note-teal" x="725" y="574">&lt;&lt;extend&gt;&gt;</text>
    <path class="include" d="M 780 1047 L 780 1060" />
    <text class="note" x="855" y="1065">&lt;&lt;include&gt;&gt;</text>

    <path class="include" d="M 1260 600 L 1226 600" />
    <text class="note" x="1238" y="579">&lt;&lt;include&gt;&gt;</text>
    <path class="include" d="M 1265 730 L 1228 730" />
    <text class="note" x="1240" y="709">&lt;&lt;include&gt;&gt;</text>
    <path class="include" d="M 1268 860 L 1240 860" />
