<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Campus RFID Patrol System Use Case Diagram</title>
  <desc id="desc">Use case diagram for the Campus RFID Patrol System with Security Guard, Supervisor/Admin, ESP32 RFID Reader, and Camera actors.</desc>
  <defs>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#334155" stroke-width="1.7"/>
    </marker>
    <style>
      .canvas { fill: #fff; }
      .boundary { fill: #fff; stroke: #111827; stroke-width: 1.5; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #111827; }
      .actor { stroke: #374151; stroke-width: 1.6; fill: none; }
      .actor-label { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #111827; text-anchor: middle; }
      .usecase { fill: #67b7ff; stroke: #2f80d1; stroke-width: 1.6; }
      .usecase-text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .association { stroke: #475569; stroke-width: 1.35; fill: none; }
      .dependency { stroke: #334155; stroke-width: 1.4; fill: none; stroke-dasharray: 8 6; marker-end: url(#open-arrow); }
      .label-box { fill: #fff; stroke: none; opacity: .96; }
      .dep-label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1400" height="1000"/>
  <rect class="boundary" x="190" y="36" width="1020" height="910" rx="7"/>
  <text class="title" x="700" y="75" text-anchor="middle">Campus RFID Patrol System</text>

  <!-- Actors -->
  <g transform="translate(88 245)">
    <circle class="actor" cx="0" cy="0" r="20"/>
    <path class="actor" d="M0 20 L0 92 M-45 52 L45 52 M0 92 L-40 152 M0 92 L40 152"/>
    <text class="actor-label" x="0" y="184">Security Guard</text>
  </g>

  <g transform="translate(1314 260)">
    <circle class="actor" cx="0" cy="0" r="20"/>
    <path class="actor" d="M0 20 L0 92 M-45 52 L45 52 M0 92 L-40 152 M0 92 L40 152"/>
    <text class="actor-label" x="0" y="184">Supervisor / Admin</text>
  </g>

  <g transform="translate(88 755)">
    <circle class="actor" cx="0" cy="0" r="20"/>
    <path class="actor" d="M0 20 L0 92 M-45 52 L45 52 M0 92 L-40 152 M0 92 L40 152"/>
    <text class="actor-label" x="0" y="184">ESP32 RFID Reader</text>
  </g>

  <g transform="translate(1314 700)">
    <circle class="actor" cx="0" cy="0" r="20"/>
    <path class="actor" d="M0 20 L0 92 M-45 52 L45 52 M0 92 L-40 152 M0 92 L40 152"/>
    <text class="actor-label" x="0" y="184">Camera</text>
  </g>

  <!-- Shared access use case -->
  <ellipse class="usecase" cx="665" cy="125" rx="95" ry="40"/>
  <text class="usecase-text" x="665" y="125">Log in</text>

  <!-- Security guard workflow -->
  <ellipse class="usecase" cx="365" cy="210" rx="128" ry="44"/>
  <text class="usecase-text" x="365" y="210">Register Face Data</text>

  <ellipse class="usecase" cx="365" cy="345" rx="118" ry="45"/>
  <text class="usecase-text" x="365" y="345">Scan RFID Card</text>

  <ellipse class="usecase" cx="365" cy="500" rx="106" ry="42"/>
  <text class="usecase-text" x="365" y="500">Verify Face</text>

  <ellipse class="usecase" cx="365" cy="650" rx="144" ry="48"/>
  <text class="usecase-text" x="365" y="642">
    <tspan x="365" dy="0">Complete Patrol</tspan>
    <tspan x="365" dy="20">Checklist</tspan>
  </text>

  <ellipse class="usecase" cx="365" cy="805" rx="135" ry="48"/>
  <text class="usecase-text" x="365" y="797">
    <tspan x="365" dy="0">Submit Incident</tspan>
    <tspan x="365" dy="20">Report</tspan>
  </text>

  <!-- Automated validation and device use cases -->
  <ellipse class="usecase" cx="665" cy="210" rx="132" ry="44"/>
  <text class="usecase-text" x="665" y="202">
    <tspan x="665" dy="0">Capture Face</tspan>
    <tspan x="665" dy="20">Image</tspan>
  </text>

  <ellipse class="usecase" cx="665" cy="315" rx="108" ry="42"/>
  <text class="usecase-text" x="665" y="315">Identify Guard</text>

  <ellipse class="usecase" cx="665" cy="410" rx="132" ry="44"/>
  <text class="usecase-text" x="665" y="402">
    <tspan x="665" dy="0">Check Patrol</tspan>
    <tspan x="665" dy="20">Schedule</tspan>
  </text>

  <ellipse class="usecase" cx="665" cy="500" rx="124" ry="44"/>
  <text class="usecase-text" x="665" y="492">
    <tspan x="665" dy="0">Capture Live</tspan>
    <tspan x="665" dy="20">Face</tspan>
  </text>

  <ellipse class="usecase" cx="665" cy="595" rx="132" ry="44"/>
  <text class="usecase-text" x="665" y="587">
    <tspan x="665" dy="0">Compare Face</tspan>
    <tspan x="665" dy="20">Descriptor</tspan>
  </text>

  <ellipse class="usecase" cx="665" cy="690" rx="120" ry="44"/>
  <text class="usecase-text" x="665" y="682">
    <tspan x="665" dy="0">Record Patrol</tspan>
    <tspan x="665" dy="20">Log</tspan>
  </text>

  <ellipse class="usecase" cx="665" cy="820" rx="126" ry="46"/>
  <text class="usecase-text" x="665" y="812">
    <tspan x="665" dy="0">Send Reader</tspan>
    <tspan x="665" dy="20">Heartbeat</tspan>
  </text>

  <!-- Supervisor use cases -->
  <ellipse class="usecase" cx="985" cy="150" rx="126" ry="44"/>
  <text class="usecase-text" x="985" y="142">
    <tspan x="985" dy="0">Manage Guard</tspan>
    <tspan x="985" dy="20">Accounts</tspan>
  </text>

  <ellipse class="usecase" cx="985" cy="260" rx="132" ry="44"/>
  <text class="usecase-text" x="985" y="260">Manage Checkpoints</text>

  <ellipse class="usecase" cx="985" cy="370" rx="132" ry="44"/>
  <text class="usecase-text" x="985" y="362">
    <tspan x="985" dy="0">Monitor RFID</tspan>
    <tspan x="985" dy="20">Readers</tspan>
  </text>

  <ellipse class="usecase" cx="985" cy="480" rx="116" ry="42"/>
  <text class="usecase-text" x="985" y="480">View Dashboard</text>

  <ellipse class="usecase" cx="985" cy="590" rx="120" ry="42"/>
  <text class="usecase-text" x="985" y="590">View Scan Issues</text>

  <ellipse class="usecase" cx="985" cy="700" rx="120" ry="42"/>
  <text class="usecase-text" x="985" y="700">Generate Reports</text>

  <ellipse class="usecase" cx="985" cy="815" rx="134" ry="44"/>
  <text class="usecase-text" x="985" y="807">
    <tspan x="985" dy="0">Manage</tspan>
    <tspan x="985" dy="20">Notifications</tspan>
  </text>

  <!-- Actor associations -->
  <path class="association" d="M133 297 L570 125"/>
  <path class="association" d="M133 297 L240 210"/>
  <path class="association" d="M133 297 L248 345"/>
  <path class="association" d="M133 297 L268 500"/>
  <path class="association" d="M133 297 L225 650"/>
  <path class="association" d="M133 297 L249 805"/>

  <path class="association" d="M133 807 L248 345"/>
  <path class="association" d="M133 807 L539 820"/>

  <path class="association" d="M1269 312 L760 125"/>
  <path class="association" d="M1269 312 L1110 150"/>
  <path class="association" d="M1269 312 L1116 260"/>
  <path class="association" d="M1269 312 L1117 370"/>
  <path class="association" d="M1269 312 L1101 480"/>
  <path class="association" d="M1269 312 L1105 590"/>
  <path class="association" d="M1269 312 L1104 700"/>
  <path class="association" d="M1269 312 L1116 815"/>

  <path class="association" d="M1269 752 L790 500"/>
  <path class="association" d="M1269 752 L789 210"/>

  <!-- Include and extend relationships -->
  <path class="dependency" d="M493 210 L533 210"/>
  <g transform="translate(513 188)">
    <rect class="label-box" x="-48" y="-12" width="96" height="24"/>
    <text class="dep-label" x="0" y="0">&lt;&lt;include&gt;&gt;</text>
  </g>

  <path class="dependency" d="M481 338 L558 321"/>
  <g transform="translate(523 314)">
    <rect class="label-box" x="-48" y="-12" width="96" height="24"/>
    <text class="dep-label" x="0" y="0">&lt;&lt;include&gt;&gt;</text>
  </g>

  <path class="dependency" d="M475 365 L542 394"/>
  <g transform="translate(516 385)">
    <rect class="label-box" x="-48" y="-12" width="96" height="24"/>
    <text class="dep-label" x="0" y="0">&lt;&lt;include&gt;&gt;</text>
  </g>

  <path class="dependency" d="M471 500 L541 500"/>
  <g transform="translate(506 478)">
    <rect class="label-box" x="-48" y="-12" width="96" height="24"/>
    <text class="dep-label" x="0" y="0">&lt;&lt;include&gt;&gt;</text>
  </g>

  <path class="dependency" d="M453 524 L546 575"/>
  <g transform="translate(512 552)">
    <rect class="label-box" x="-48" y="-12" width="96" height="24"/>
    <text class="dep-label" x="0" y="0">&lt;&lt;include&gt;&gt;</text>
  </g>

  <path class="dependency" d="M394 603 C399 579 399 553 393 532"/>
  <g transform="translate(449 568)">
    <rect class="label-box" x="-48" y="-12" width="96" height="24"/>
    <text class="dep-label" x="0" y="0">&lt;&lt;include&gt;&gt;</text>
  </g>

  <path class="dependency" d="M505 658 L548 676"/>
  <g transform="translate(527 649)">
