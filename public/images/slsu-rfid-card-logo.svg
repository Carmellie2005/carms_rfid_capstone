<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
    <title id="title">SLSU RFID Patrol Card Logo</title>
    <desc id="desc">A clean RFID card badge logo using the Southern Leyte State University seal.</desc>
    <defs>
        <linearGradient id="cardGradient" x1="164" y1="186" x2="860" y2="838" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#173d7a"/>
            <stop offset="1" stop-color="#171751"/>
        </linearGradient>
        <linearGradient id="lineGradient" x1="214" y1="254" x2="810" y2="760" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7cc4f1"/>
            <stop offset="1" stop-color="#2089ce"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.22"/>
        </filter>
        <clipPath id="sealClip">
            <circle cx="512" cy="492" r="184"/>
        </clipPath>
    </defs>

    <g filter="url(#shadow)">
        <rect x="142" y="206" width="740" height="612" rx="86" fill="url(#cardGradient)"/>
        <rect x="176" y="240" width="672" height="544" rx="62" fill="#ffffff"/>
        <rect x="198" y="262" width="628" height="500" rx="46" fill="#eff6ff"/>
        <path d="M248 704 C338 632, 408 646, 500 706 C602 772, 692 760, 780 678" fill="none" stroke="#dbeafe" stroke-width="36" stroke-linecap="round"/>
        <path d="M250 704 C340 632, 410 646, 502 706 C604 772, 694 760, 782 678" fill="none" stroke="url(#lineGradient)" stroke-width="12" stroke-linecap="round"/>
    </g>

    <g>
        <circle cx="512" cy="492" r="214" fill="#ffffff" stroke="#171751" stroke-width="18"/>
        <circle cx="512" cy="492" r="194" fill="none" stroke="#6aa8dc" stroke-width="10"/>
        <image href="slsu-university-logo.png" x="328" y="308" width="368" height="368" preserveAspectRatio="xMidYMid meet" clip-path="url(#sealClip)"/>
    </g>

    <g transform="translate(646 318)">
        <rect x="0" y="0" width="112" height="84" rx="16" fill="#ffffff" stroke="#171751" stroke-width="10"/>
        <path d="M28 18 V66 M56 18 V66 M84 18 V66" stroke="#6aa8dc" stroke-width="8" stroke-linecap="round"/>
        <path d="M-22 42 H0 M112 42 H134" stroke="#171751" stroke-width="10" stroke-linecap="round"/>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M704 462 C732 434, 732 550, 704 522" stroke="#171751" stroke-width="20"/>
        <path d="M722 432 C778 482, 778 502, 722 552" stroke="#2089ce" stroke-width="18"/>
        <path d="M762 390 C854 470, 854 514, 762 594" stroke="#2089ce" stroke-width="20"/>
    </g>

    <g>
        <circle cx="292" cy="704" r="19" fill="#ffffff" stroke="#171751" stroke-width="8"/>
        <circle cx="512" cy="730" r="19" fill="#ffffff" stroke="#171751" stroke-width="8"/>
        <circle cx="732" cy="704" r="19" fill="#ffffff" stroke="#171751" stroke-width="8"/>
        <circle cx="292" cy="704" r="7" fill="#2089ce"/>
        <circle cx="512" cy="730" r="7" fill="#2089ce"/>
        <circle cx="732" cy="704" r="7" fill="#2089ce"/>
    </g>
</svg>
