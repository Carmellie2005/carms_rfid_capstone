<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
    <title id="title">SLSU RFID Patrol System Logo</title>
    <desc id="desc">Southern Leyte State University seal paired with clean RFID signal waves.</desc>
    <defs>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/>
        </filter>
        <linearGradient id="signalGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#0f4f8f"/>
            <stop offset="1" stop-color="#2aa7df"/>
        </linearGradient>
    </defs>

    <g filter="url(#softShadow)">
        <circle cx="218" cy="180" r="132" fill="#ffffff"/>
        <circle cx="218" cy="180" r="138" fill="none" stroke="#171751" stroke-width="10"/>
        <circle cx="218" cy="180" r="124" fill="none" stroke="#6aa8dc" stroke-width="6"/>
        <image href="slsu-university-logo.png" x="98" y="60" width="240" height="240" preserveAspectRatio="xMidYMid meet"/>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 407 180 C 440 145, 440 215, 407 180" stroke="#171751" stroke-width="18"/>
        <path d="M 425 141 C 475 178, 475 182, 425 219" stroke="#ffffff" stroke-width="8"/>
        <path d="M 425 141 C 475 178, 475 182, 425 219" stroke="url(#signalGradient)" stroke-width="22"/>
        <path d="M 492 97 C 592 162, 592 198, 492 263" stroke="#ffffff" stroke-width="10"/>
        <path d="M 492 97 C 592 162, 592 198, 492 263" stroke="url(#signalGradient)" stroke-width="24"/>
        <path d="M 572 52 C 725 145, 725 215, 572 308" stroke="#ffffff" stroke-width="12"/>
        <path d="M 572 52 C 725 145, 725 215, 572 308" stroke="url(#signalGradient)" stroke-width="26"/>
    </g>

    <g fill="#ffffff" stroke="#171751" stroke-width="7">
        <circle cx="386" cy="180" r="18"/>
        <circle cx="483" cy="93" r="10"/>
        <circle cx="483" cy="267" r="10"/>
    </g>

    <g fill="#2aa7df">
        <circle cx="386" cy="180" r="7"/>
        <circle cx="483" cy="93" r="4"/>
        <circle cx="483" cy="267" r="4"/>
    </g>
</svg>
